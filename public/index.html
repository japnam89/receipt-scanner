<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="receiptScanner">Receipt Scanner</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; }
    .wrap { max-width: 880px; margin: 0 auto; padding: 24px; }
    .heading-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    .heading-row h1 { margin-top: 0.67em; }
    .account-profile { max-width: 50%; padding-top: 12px; text-align: right; overflow-wrap: anywhere; }
    .account-name { font-size: 14px; font-weight: 600; }
    .account-email { color: #94a3b8; font-size: 13px; }
    h1 { font-size: 22px; }
    button { background: #2563eb; color: #fff; border: 0; padding: 10px 14px; border-radius: 8px; cursor: pointer; font-size: 14px; }
    button.ghost { background: #334155; }
    .button-link { display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 8px; background: #2563eb; color: #fff; text-decoration: none; font-size: 14px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
    .currency-control { display: flex; align-items: center; gap: 8px; color: #cbd5e1; font-size: 14px; }
    select { min-height: 40px; padding: 8px 10px; border: 1px solid #475569; border-radius: 6px; background: #1e293b; color: #e2e8f0; font-size: 14px; }
    .table-wrap { width: 100%; overflow-x: auto; margin-top: 20px; }
    table { width: 100%; min-width: 720px; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #1e293b; }
    th { padding-bottom: 16px; color: #94a3b8; font-weight: 600; }
    a { color: #60a5fa; }
    .hint { color: #94a3b8; font-size: 13px; }
    .empty-state { color: #cbd5e1; font-size: 14px; padding: 18px 8px; }
    .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid rgba(148,163,184,0.45); border-top-color: #60a5fa; border-radius: 50%; vertical-align: middle; animation: spin 0.8s linear infinite; margin-right: 8px; }
    .actions { display: flex; gap: 6px; }
    .mini-btn { border: 0; border-radius: 6px; padding: 6px 8px; font-size: 12px; cursor: pointer; }
    .mini-btn.edit { background: #334155; }
    .mini-btn.delete { background: #7f1d1d; }
    .pagination { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; }
    .pagination[hidden] { display: none; }
    .pagination-controls { display: flex; align-items: center; gap: 10px; }
    .pagination button:disabled { opacity: .45; cursor: not-allowed; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 640px) {
      .wrap { padding: 16px; }
      .heading-row { align-items: flex-start; flex-direction: column; gap: 0; }
      .heading-row h1 { margin-bottom: 4px; }
      .account-profile { max-width: 100%; padding-top: 0; text-align: left; }
      .table-wrap { overflow: visible; }
      table, tbody { display: block; width: 100%; min-width: 0; }
      thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; }
      tbody tr { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 2px 12px; margin: 12px 0; padding: 10px; border: 1px solid #1e293b; background: #111c33; }
      tbody td { display: flex; justify-content: space-between; gap: 10px; min-width: 0; padding: 6px 2px; border: 0; text-align: right; overflow-wrap: anywhere; }
      tbody td::before { content: attr(data-label); color: #94a3b8; font-weight: 600; text-align: left; }
      tbody td[data-field="name"], tbody td[data-field="actions"] { grid-column: 1 / -1; }
      .pagination { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="heading-row">
      <h1>🧾 <span data-i18n="receiptScanner">Receipt Scanner</span></h1>
      <div id="account-profile" class="account-profile" aria-live="polite" hidden>
        <div id="account-name" class="account-name"></div>
        <div id="account-email" class="account-email"></div>
      </div>
    </div>
    <p class="hint"><span data-i18n="driveHint">Connect Google Drive once via</span> <a id="auth-link" href="/auth">/auth</a><span data-i18n="thenScan">, then scan. CRUD works without Drive too.</span></p>
    <div class="row">
      <button id="scan" data-i18n="scanGoogleDrive">Scan Google Drive</button>
      <a id="upload-link" class="button-link" href="/upload" data-i18n="uploadPdfs">Upload PDFs</a>
      <button id="refresh" class="ghost" data-i18n="refreshList">Refresh list</button>
      <button id="logout" class="ghost" data-i18n="logOut">Log out</button>
      <label class="currency-control" for="display-currency"><span data-i18n="displayCurrency">Display currency</span>
        <select id="display-currency">
          <option value="USD">USD</option>
          <option value="CAD">CAD</option>
          <option value="INR">INR</option>
        </select>
      </label>
      <label class="currency-control" for="language-select"><span data-i18n="language">Language</span>
        <select id="language-select" data-i18n-aria-label="language"><option value="en">English</option><option value="hi">हिन्दी</option><option value="pa">ਪੰਜਾਬੀ</option></select>
      </label>
    </div>
    <div id="model-info" class="hint" role="status" data-i18n="loadingModel">Loading extraction model…</div>
    <div id="status" class="hint" data-i18n="loadingReceipts">Loading receipts…</div>
    <div class="table-wrap">
      <table>
        <thead><tr><th data-i18n="id">ID</th><th data-i18n="type">Type</th><th data-i18n="name">Name</th><th data-i18n="merchant">Merchant</th><th data-i18n="total">Total</th><th data-i18n="date">Date</th><th data-i18n="link">Link</th><th data-i18n="actions">Actions</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <nav id="pagination" class="pagination" aria-label="Receipt pages" data-i18n-aria-label="receiptPages" hidden>
      <span id="pagination-summary" class="hint"></span>
      <div class="pagination-controls">
        <button id="previous-page" class="ghost" type="button" data-i18n="previous">Previous</button>
        <span id="page-indicator" class="hint" aria-live="polite"></span>
        <button id="next-page" class="ghost" type="button" data-i18n="next">Next</button>
      </div>
    </nav>
  </div>
  <script src="/*I18N_SCRIPT*/"></script>
  <script>
    const injectedBase = /*BASE_PATH*/ "";
    const AUTO_SCAN = /*AUTO_SCAN*/ false;
    const currentPath = window.location.pathname || "/";
    const resolvedBase = currentPath.startsWith("/receipt") ? "/receipt" : "";
    const BASE_PREFIX = resolvedBase || (injectedBase && injectedBase !== "/" ? injectedBase.replace(/\/+$/, "") : "");
    const rows = document.getElementById("rows");
    const status = document.getElementById("status");
    const modelInfo = document.getElementById("model-info");
    const pagination = document.getElementById("pagination");
    const paginationSummary = document.getElementById("pagination-summary");
    const pageIndicator = document.getElementById("page-indicator");
    const authLink = document.getElementById("auth-link");
    const uploadLink = document.getElementById("upload-link");
    const currencySelect = document.getElementById("display-currency");
    const accountProfile = document.getElementById("account-profile");
    const accountName = document.getElementById("account-name");
    const accountEmail = document.getElementById("account-email");
    const t = window.receiptI18n.t;
    const supportedCurrencies = ["USD", "CAD", "INR"];
    let displayCurrency = localStorage.getItem("receiptDisplayCurrency");
    if (!supportedCurrencies.includes(displayCurrency)) displayCurrency = "CAD";
    currencySelect.value = displayCurrency;
    let exchangeRates;
    const PAGE_SIZE = 10;
    let allReceipts = [];
    let currentPage = 1;
    authLink.href = BASE_PREFIX ? BASE_PREFIX + "/auth" : "/auth";

    function stringifyMerchant(value) {
      const raw = String(value || "").trim();
      if (!raw) return t("unknownMerchant");
      let cleaned = raw
        .replace(/\.[a-z0-9]+$/i, "")
        .replace(/[_-]+/g, " ")
        .replace(/\s*\([^)]*\)/g, " ")
        .replace(/\b(?:email\s*receipt|test\s*receipt|invoice|order|receipt|confirmation|bill|payment|download|file)\b/gi, " ")
        .replace(/(?<![A-Za-z])[0-9]+(?![A-Za-z])/g, " ")
        .replace(/[^A-Za-z0-9&\s.-]/g, " ")
        .replace(/\s+/g, " ")
        .trim();

      if (!cleaned || /^unknown merchant$/i.test(cleaned)) return t("unknownMerchant");
      if (/^(?:order|invoice|receipt|email|confirmation|bill|payment|test)/i.test(cleaned)) return t("unknownMerchant");
      if (/^[\d\s]+$/.test(cleaned)) return t("unknownMerchant");
      return cleaned;
    }

    function setLoading(message) {
      status.innerHTML = `<span class="spinner"></span>${message}`;
    }

    function renderEmptyState() {
      allReceipts = [];
      currentPage = 1;
      pagination.hidden = true;
      rows.innerHTML = `<tr><td colspan="8" class="empty-state">${t("noReceiptsYet")}</td></tr>`;
    }

    function renderPage() {
      const totalPages = Math.max(1, Math.ceil(allReceipts.length / PAGE_SIZE));
      currentPage = Math.min(currentPage, totalPages);
      const start = (currentPage - 1) * PAGE_SIZE;
      const pageReceipts = allReceipts.slice(start, start + PAGE_SIZE);
      rows.innerHTML = pageReceipts.map((x, pageIndex) => `<tr>
        <td data-field="id" data-label="${t("id")}">${start + pageIndex + 1}</td><td data-field="type" data-label="${t("type")}">${window.receiptI18n.documentType(x.document_type)}</td><td data-field="name" data-label="${t("name")}">${x.name}</td><td data-field="merchant" data-label="${t("merchant")}">${stringifyMerchant(x.merchant || x.name)}</td>
        <td data-field="total" data-label="${t("total")}">${formatReceiptTotal(x)}</td><td data-field="date" data-label="${t("date")}">${window.receiptI18n.formatDate(x.receipt_date)}</td>
        <td data-field="link" data-label="${t("link")}">${x.web_view_link ? `<a href="${x.web_view_link}" target="_blank" rel="noreferrer">${t("drive")}</a>` : ""}</td>
        <td data-field="actions" data-label="${t("actions")}" class="actions">
          <button class="mini-btn edit" data-action="edit" data-id="${x.id}" data-merchant="${String(x.merchant || x.name || "").replace(/"/g, '&quot;')}">${t("edit")}</button>
          <button class="mini-btn delete" data-action="delete" data-id="${x.id}">${t("delete")}</button>
        </td>
      </tr>`).join("");
      pagination.hidden = allReceipts.length <= PAGE_SIZE;
      paginationSummary.textContent = t("showing", { start: start + 1, end: Math.min(start + PAGE_SIZE, allReceipts.length), total: allReceipts.length });
      pageIndicator.textContent = t("page", { current: currentPage, total: totalPages });
      document.getElementById("previous-page").disabled = currentPage === 1;
      document.getElementById("next-page").disabled = currentPage === totalPages;
    }

    function apiUrl(path) {
      return BASE_PREFIX ? `${BASE_PREFIX}/${path.replace(/^\//, "")}` : `/${path.replace(/^\//, "")}`;
    }

    uploadLink.href = apiUrl("upload");

    async function loadProfile() {
      try {
        const response = await fetch(apiUrl("api/profile"));
        if (!response.ok) throw new Error("Profile unavailable");
        const profile = await response.json();
        accountName.textContent = profile.name || profile.email || t("accountName");
        accountEmail.textContent = profile.email;
        accountProfile.hidden = false;
      } catch {
        accountProfile.hidden = true;
      }
    }

    async function loadModelInfo() {
      try {
        const response = await fetch(apiUrl("api/ocr-info"));
        if (!response.ok) throw new Error(t("modelLoadError"));
        const info = await response.json();
        modelInfo.textContent = t("modelInfo", info);
      } catch {
        modelInfo.textContent = t("couldNotLoadModel");
      }
    }

    async function loadExchangeRates() {
      if (exchangeRates !== undefined) return exchangeRates;
      try {
        const response = await fetch("https://api.frankfurter.dev/v1/latest?base=CAD&symbols=USD,INR");
        if (!response.ok) throw new Error(t("exchangeRateError"));
        const result = await response.json();
        exchangeRates = { CAD: 1, ...result.rates };
      } catch {
        exchangeRates = null;
      }
      return exchangeRates;
    }

    function formatCurrency(amount, currency) {
      try {
        return new Intl.NumberFormat(window.receiptI18n.localeTag(), { style: "currency", currency }).format(amount);
      } catch {
        return `${currency} ${amount.toFixed(2)}`;
      }
    }

    function formatReceiptTotal(receipt) {
      if (receipt.total === null || receipt.total === undefined || receipt.total === "") return "";
      const amount = Number(receipt.total);
      if (!Number.isFinite(amount)) return "";
      const storedCurrency = String(receipt.currency || "USD").trim().toUpperCase();
      const sourceCurrency = storedCurrency === "$" || storedCurrency === "CA$" ? "CAD" : storedCurrency === "US$" ? "USD" : storedCurrency;
      if (sourceCurrency === displayCurrency) return formatCurrency(amount, displayCurrency);
      if (!exchangeRates || !Number.isFinite(exchangeRates[sourceCurrency]) || !Number.isFinite(exchangeRates[displayCurrency])) {
        return formatCurrency(amount, sourceCurrency);
      }
      const convertedAmount = (amount / exchangeRates[sourceCurrency]) * exchangeRates[displayCurrency];
      return formatCurrency(convertedAmount, displayCurrency);
    }

    async function editReceipt(id) {
      const current = rows.querySelector(`[data-id="${id}"]`)?.dataset?.merchant || "";
      const nextValue = window.prompt(t("editMerchant"), current || "");
      if (nextValue === null) return;
      const merchant = nextValue.trim();
      if (!merchant) return;

      const r = await fetch(apiUrl(`api/receipts/${id}`), {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ merchant })
      });

      if (!r.ok) {
        status.textContent = t("couldNotUpdate");
        return;
      }

      await load();
    }

    async function deleteReceipt(id) {
      const confirmed = window.confirm(t("deleteReceipt"));
      if (!confirmed) return;

      const r = await fetch(apiUrl(`api/receipts/${id}`), { method: "DELETE" });
      if (!r.ok) {
        status.textContent = t("couldNotDelete");
        return;
      }

      await load();
    }

    async function load() {
      setLoading(t("loadingReceipts"));
      try {
        await loadExchangeRates();
        const r = await fetch(apiUrl("api/receipts"));
        const payload = await r.json();
        const data = Array.isArray(payload) ? payload : Array.isArray(payload?.value) ? payload.value : [];

        if (!Array.isArray(data) || data.length === 0) {
          renderEmptyState();
          status.textContent = t("noReceiptsFound");
          return;
        }

        allReceipts = data;
        renderPage();
        status.textContent = `${t("loadedReceipts", { count: data.length })}${exchangeRates ? "" : ` ${t("exchangeRatesUnavailable")}`}`;
      } catch (e) {
        rows.innerHTML = "";
        renderEmptyState();
        status.textContent = t("unableLoadReceipts");
      }
    }

    async function scanNow() {
      setLoading(t("scanning"));
      try {
        const r = await fetch(apiUrl("api/scan"), { method: "POST" });
        const j = await r.json();
        status.textContent = r.ok ? t("scannedFiles", { count: j.scanned }) : t("errorPrefix", { error: j.error });
        await load();
      } catch (e) {
        status.textContent = t("scanFailed");
      }
    }

    async function maybeAutoScanAfterAuth() {
      const params = new URLSearchParams(window.location.search);
      if (!AUTO_SCAN && params.get("afterAuth") !== "1") return false;

      params.delete("afterAuth");
      const nextUrl = `${window.location.pathname}${params.toString() ? `?${params.toString()}` : ""}${window.location.hash || ""}`;
      history.replaceState({}, "", nextUrl);
      await load();
      await scanNow();
      return true;
    }

    document.addEventListener("click", async (event) => {
      const target = event.target.closest("button[data-action]");
      if (!target) return;
      const id = Number(target.dataset.id);
      if (!id) return;
      if (target.dataset.action === "edit") {
        await editReceipt(id);
      }
      if (target.dataset.action === "delete") {
        await deleteReceipt(id);
      }
    });

    document.getElementById("refresh").onclick = load;
    document.getElementById("scan").onclick = scanNow;
    document.getElementById("previous-page").onclick = () => {
      if (currentPage > 1) {
        currentPage--;
        renderPage();
      }
    };
    document.getElementById("next-page").onclick = () => {
      if (currentPage < Math.ceil(allReceipts.length / PAGE_SIZE)) {
        currentPage++;
        renderPage();
      }
    };
    loadModelInfo();
    currencySelect.onchange = () => {
      displayCurrency = currencySelect.value;
      localStorage.setItem("receiptDisplayCurrency", displayCurrency);
      load();
    };
    document.getElementById("logout").onclick = async () => {
      const logoutButton = document.getElementById("logout");
      logoutButton.disabled = true;
      try {
        const response = await fetch(apiUrl("auth/logout"), { method: "POST" });
        if (!response.ok) throw new Error(t("logoutRequestFailed"));
        window.location.assign(BASE_PREFIX ? `${BASE_PREFIX}/auth` : "/auth");
      } catch {
        status.textContent = t("couldNotLogOut");
        logoutButton.disabled = false;
      }
    };

    window.addEventListener("receipt-locale-change", () => {
      renderPage();
      loadModelInfo();
      load();
    });

    loadProfile();
    maybeAutoScanAfterAuth().then((didAutoScan) => {
      if (!didAutoScan) load();
    });
  </script>
</body>
</html>
