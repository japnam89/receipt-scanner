# receipt-scanner Docker Compose with Traefik labels
# 
# Traefik runs on network_mode: host and CANNOT join bridge networks
# ("container sharing network namespace with another container or host 
# cannot be connected to any other network").
# 
# Solution: receipt-scanner uses the default bridge network with port
# mapping (4000:4000). Traefik (host network) reaches it via 127.0.0.1:4000
# — no network connect needed. Traefik's Docker provider discovers the
# container via Docker API, sees the published port, and creates the
# backend service automatically.
version: "3.8"

services:
  receipt-scanner:
    build: .
    container_name: receipt-scanner
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file: .env
    environment:
      - OAUTH_REDIRECT_URI=https://japnam.tech/receipt/oauth2callback
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:4000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.receipt.rule=Host(`japnam.tech`) && PathPrefix(`/receipt`)"
      - "traefik.http.routers.receipt.entrypoints=websecure"
      - "traefik.http.routers.receipt.priority=10"
      - "traefik.http.routers.receipt.tls=true"
      - "traefik.http.routers.receipt.tls.certresolver=letsencrypt"
      - "traefik.http.middlewares.receipt-stripprefix.stripprefix.prefixes=/receipt"
      - "traefik.http.routers.receipt.middlewares=receipt-stripprefix"
      - "traefik.http.services.receipt.loadbalancer.server.port=4000"
