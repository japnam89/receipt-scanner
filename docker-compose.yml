# receipt-scanner Docker Compose with Traefik labels
#
# Traefik runs with network_mode: host + --providers.docker.exposedbydefault=false.
# A host-networked container has no Docker bridge IP, so Traefik's auto-discovery
# can't determine the backend address. We specify it explicitly with the
# loadbalancer.servers[0].url label.
#
# NOTE: Traefik (host network) CANNOT join bridge networks, so we keep
# network_mode: host and use the explicit servers[0].url label.
version: "3.8"

services:
  receipt-scanner:
    build: .
    container_name: receipt-scanner
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment:
      - OAUTH_REDIRECT_URI=https://japnam.tech/receipt/oauth2callback
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:4000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.receipt.rule=Host(`japnam.tech`) && PathPrefix(`/receipt`)"
      - "traefik.http.routers.receipt.entrypoints=websecure"
      - "traefik.http.routers.receipt.priority=10"
      - "traefik.http.routers.receipt.tls=true"
      - "traefik.http.routers.receipt.tls.certresolver=letsencrypt"
      - "traefik.http.middlewares.receipt-stripprefix.stripprefix.prefixes=/receipt"
      - "traefik.http.routers.receipt.middlewares=receipt-stripprefix"
      - "traefik.http.services.receipt.loadbalancer.servers[0].url=http://127.0.0.1:4000"
